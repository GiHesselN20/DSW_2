spring.application.name=jb-modas-api
server.port=${PORT:8080}

# ---------------------------------------------------------------------------
# Como ler: ${NOME:valor} = usa a variável de ambiente NOME; se ela não existir, usa "valor".
# Rodando na sua máquina, basta ajustar os valores padrão abaixo (principalmente a senha do MySQL).
# ---------------------------------------------------------------------------

# Banco MySQL. createDatabaseIfNotExist=true cria o banco "jb_modas" sozinho se ele não existir.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/jb_modas?createDatabaseIfNotExist=true&serverTimezone=America/Sao_Paulo}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:1234}

# O Hibernate cria/atualiza as tabelas a partir das classes da pasta model/entity (sem apagar dados).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# JSON com campo desconhecido (ex.: nome digitado errado) é recusado com erro 400.
spring.jackson.deserialization.fail-on-unknown-properties=true
server.error.include-message=never

# ---- Token de login (JWT) ----
# Chave que assina o token. Precisa ter 32+ caracteres. TROQUE antes de publicar a API.
app.jwt.secret=${JWT_SECRET:troque-esta-chave-por-uma-bem-grande-com-mais-de-32-caracteres}
# Quantos minutos o token vale depois do login.
app.jwt.minutes=${JWT_MINUTES:60}

# ---- Primeiro usuário ----
# Criado automaticamente na primeira execução, SOMENTE se a tabela usuario estiver vazia.
# É com ele que você faz o primeiro login. Senha: de 8 a 60 caracteres. TROQUE a senha.
app.admin.email=${ADMIN_EMAIL:dona@jbmodas.com}
app.admin.password=${ADMIN_PASSWORD:troque1234}

# Endereço do front-end que pode chamar esta API pelo navegador (CORS).
app.cors.origin=${CORS_ORIGIN:http://localhost:4200}
